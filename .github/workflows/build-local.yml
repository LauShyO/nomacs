name: build-local-windows

# Local build for LauShyO/nomacs: builds the Windows portable zip on a
# GitHub-hosted Windows runner, mirroring upstream's appveyor.yml recipe
# (same dependency bundle, same cmake flags, same portable script),
# and publishes it as a Release in this repo.
# Manual trigger only, so versioning stays deliberate.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          # Qt 6.11.x uses a new online-repository layout that aqtinstall
          # (used by install-qt-action) cannot read yet, so the newest
          # fetchable Qt is 6.10.3. QtSvg ships inside the base package
          # there, so it is not listed as a module.
          version: '6.10.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtimageformats qt5compat'

      - name: Download dependencies (same bundle as upstream AppVeyor build)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/novomesk/downloads/raw/refs/heads/main/nasm-3.02-win64.zip" -OutFile nasm.zip
          Invoke-WebRequest -Uri "https://github.com/novomesk/downloads/raw/refs/heads/main/nomacs/nomacs-dependencies-2026-10-23.7z" -OutFile nomacs-dependencies.7z
          7z x nasm.zip -y | Out-Null
          New-Item -ItemType Directory -Force -Path 3rd-party | Out-Null
          7z x "-o3rd-party" nomacs-dependencies.7z -y | Out-Null
          $nasm = Get-ChildItem -Directory -Filter "nasm-*" | Select-Object -First 1
          Rename-Item $nasm.FullName "NASM"
          "$PWD\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Get-ChildItem 3rd-party | Select-Object Name

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ensure pkg-config
        shell: pwsh
        run: |
          if (-not (Get-Command pkg-config -ErrorAction SilentlyContinue)) {
            choco install pkgconfiglite -y --no-progress
          }
          pkg-config --version

      - name: Configure (mirrors upstream appveyor.yml)
        shell: cmd
        run: |
          mkdir build
          cd build
          cmake -G "NMake Makefiles" -DCMAKE_PREFIX_PATH="${{ steps.qt.outputs.qtDir }};${{ github.workspace }}\3rd-party" -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}\installer\nomacs.x64" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DOpenCV_DIR="${{ github.workspace }}\3rd-party\lib" -DENABLE_QUAZIP=ON ..\ImageLounge

      - name: Build and install
        shell: cmd
        working-directory: build
        run: |
          nmake
          nmake install

      - name: Make portable zip (upstream script)
        shell: cmd
        working-directory: installer
        run: |
          python ..\scripts\make-portable.py
          dir nomacs-portable-win.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nomacs-portable-win
          path: installer/nomacs-portable-win.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 3.23.4-local.2
          name: 3.23.4-local.2
          body: |
            Local build (LauShyO/nomacs) from upstream master b67b4d7 + local patches:

            - Frameless mode (F10, non-fullscreen): the area outside the image is now truly transparent. The viewport no longer paints the opaque theme background over the translucent frameless window, and the main window no longer fills the strips around the central widget. Full screen and normal mode are unchanged. Patch file: .local/frameless-transparency.patch
            - New WinUI 3 style themes "WinUI Dark" and "WinUI Light" (Settings > General > Nomacs Theme): rounded translucent menus, settings page with navigation entries and group cards, checkboxes as toggle switches, Fluent controls, thin scrollbars. Accent spots follow the Windows system accent color; the main window gets a matching title bar and Mica backdrop. Stock themes are untouched. Patch file: .local/winui3-theme.patch
            - The WinUI pair follows the Windows dark/light app mode automatically: selecting either WinUI theme loads the variant matching the OS and switches live when the OS scheme flips.

            Asset: nomacs-portable-win.zip (portable, no installer).
          files: installer/nomacs-portable-win.zip
